AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  OpsSage AI - Serverless Backend Infrastructure (AWS SAM)
  FastAPI + Mangum on AWS Lambda (Container Image) with Amazon API Gateway HTTP API.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name

  AppName:
    Type: String
    Default: opssage-ai
    Description: Application name identifier

  LambdaMemorySize:
    Type: Number
    Default: 2048
    MinValue: 1024
    MaxValue: 10240
    Description: Lambda memory allocation in MB (2048MB provides 1 full vCPU for fast vector embeddings)

  LambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 10
    MaxValue: 30
    Description: Lambda timeout in seconds (matching API Gateway HTTP API 30s max integration limit)

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 7, 14, 30]
    Description: CloudWatch log retention in days (cost-conscious default)

  GeminiModel:
    Type: String
    Default: gemini-3.5-flash-lite
    Description: Gemini model identifier for AI Root-Cause Analysis

Globals:
  Function:
    Timeout: !Ref LambdaTimeout
    MemorySize: !Ref LambdaMemorySize

Resources:
  # ==============================================================================
  # API Gateway HTTP API (Payload Format 2.0 with CORS)
  # ==============================================================================
  OpsSageHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:8501"
          - "https://*.streamlit.app"
        AllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Requested-With"
          - "Accept"
        AllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "DELETE"
          - "OPTIONS"
        MaxAge: 3600

  # ==============================================================================
  # FastAPI Lambda Function (Container Image)
  # ==============================================================================
  OpsSageBackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Environment:
        Variables:
          APP_NAME: "OpsSage AI"
          APP_ENV: !Ref Environment
          PORT: 8000
          LOG_LEVEL: "INFO"
          INITIALIZE_INDEXES_ON_STARTUP: "false"
          MONGODB_URI: "ssm:/opssage/prod/MONGODB_URI"
          MONGODB_DB_NAME: "opssage"
          MONGODB_MAX_POOL_SIZE: 5
          MONGODB_MIN_POOL_SIZE: 0
          MONGODB_TIMEOUT_MS: 5000
          SECRET_KEY: "ssm:/opssage/prod/JWT_SECRET_KEY"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          GEMINI_API_KEY: "ssm:/opssage/prod/GEMINI_API_KEY"
          GEMINI_MODEL: !Ref GeminiModel
          EMBEDDING_PROVIDER: "sentence-transformers"
          EMBEDDING_MODEL_NAME: "sentence-transformers/all-MiniLM-L6-v2"
          EMBEDDING_DIMENSION: 384
          ATLAS_VECTOR_INDEX_NAME: "vector_index_knowledge_base"
          RAG_ENABLED: "true"
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "opssage/prod/*"
        - Statement:
            - Effect: Allow
              Action:
                - "kms:Decrypt"
              Resource: "*"
              Condition:
                StringEquals:
                  "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        RootPath:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpsSageHttpApi
            Path: /
            Method: ANY
        ProxyPath:
          Type: HttpApi
          Properties:
            ApiId: !Ref OpsSageHttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      Dockerfile: deploy/aws/lambda/Dockerfile
      DockerContext: ../../../
      DockerTag: latest

  # ==============================================================================
  # CloudWatch Log Group with Strict Retention
  # ==============================================================================
  OpsSageBackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${OpsSageBackendFunction}"
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  HttpApiUrl:
    Description: Base URL of the API Gateway HTTP API
    Value: !Sub "https://${OpsSageHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "${AWS::StackName}-HttpApiUrl"

  ApiDocsUrl:
    Description: Swagger API documentation URL
    Value: !Sub "https://${OpsSageHttpApi}.execute-api.${AWS::Region}.amazonaws.com/docs"

  ApiV1HealthUrl:
    Description: Health endpoint URL
    Value: !Sub "https://${OpsSageHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/v1/health"

  LambdaFunctionArn:
    Description: ARN of the FastAPI Mangum Lambda function
    Value: !GetAtt OpsSageBackendFunction.Arn
